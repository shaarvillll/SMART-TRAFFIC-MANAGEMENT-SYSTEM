services:
  # ── Flutter Web Frontend (Static Site) ───────────────────────────────────────
  # Pre-built Flutter web output is committed to web_dist/ so Render can serve
  # it directly without needing Flutter on the build server.
  - type: web
    name: smart-traffic-frontend
    runtime: static
    buildCommand: echo "Using pre-built Flutter web output in web_dist/"
    staticPublishPath: web_dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /flutter.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /main.dart.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
